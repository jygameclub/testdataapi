name: Process Anubis Zip

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: contains(github.event.issue.title, 'anubis')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract file URL and token from issue body
        id: extract
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Match GitHub attachment URLs ending in .zip or .txt
          FILE_URL=$(echo "$ISSUE_BODY" | grep -oP 'https://github\.com/[^\s\)\]]+\.(zip|txt)' | head -1)
          if [ -z "$FILE_URL" ]; then
            echo "No .zip or .txt attachment URL found in issue body"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "url=$FILE_URL" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Found file URL: $FILE_URL"

          # 检测文件类型
          if [[ "$FILE_URL" == *.txt ]]; then
            echo "filetype=txt" >> "$GITHUB_OUTPUT"
          else
            echo "filetype=zip" >> "$GITHUB_OUTPUT"
          fi

          # 提取自定义 token（格式: token: xxx）
          CUSTOM_TOKEN=$(echo "$ISSUE_BODY" | grep -oP '(?i)token:\s*\K\S+' | head -1)
          if [ -n "$CUSTOM_TOKEN" ]; then
            echo "token=$CUSTOM_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Found custom token: ${CUSTOM_TOKEN:0:8}..."
          else
            echo "token=" >> "$GITHUB_OUTPUT"
            echo "No custom token found, will use default"
          fi

      - name: Post skip comment with format guide
        if: steps.extract.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "⚠️ **未在 Issue 正文中找到 .zip 或 .txt 附件链接，跳过处理。**

          ### 📋 提交说明

          请在 Issue 正文中直接拖拽上传 \`.zip\` 或 \`.txt\` 文件（GitHub 会自动生成附件链接）。

          ### 📄 支持的数据格式

          **格式一：ZIP 压缩包**（内含多个 .txt 文件，JSONL 或 pretty-printed JSON）

          **格式二：单个 .txt 文件**（JSONL 或多个 pretty-printed JSON 拼接）

          支持的 JSON 结构：
          \`\`\`
          {\"dt\":{\"si\":{\"rl\":[...],\"sid\":\"...\",\"ml\":1,\"cs\":2.0,...}},\"err\":null}
          \`\`\`
          \`\`\`
          {\"code\":200,\"msg\":\"success\",\"data\":{\"rl\":[...],\"sid\":\"...\",\"singleBet\":120,...}}
          \`\`\`"

      - name: Download file
        if: steps.extract.outputs.found == 'true'
        run: |
          curl -L -o "anubis_upload.${{ steps.extract.outputs.filetype }}" "${{ steps.extract.outputs.url }}"
          ls -la anubis_upload.*

      - name: Convert txt to zip if needed
        if: steps.extract.outputs.found == 'true' && steps.extract.outputs.filetype == 'txt'
        run: |
          mkdir -p _txt_tmp
          cp anubis_upload.txt _txt_tmp/1.txt
          cd _txt_tmp && zip ../anubis_upload.zip 1.txt && cd ..
          rm -rf _txt_tmp
          echo "Converted txt to zip"
          ls -la anubis_upload.zip

      - name: Process zip
        if: steps.extract.outputs.found == 'true'
        id: process
        env:
          CUSTOM_TOKEN: ${{ steps.extract.outputs.token }}
        run: |
          python -c "
          import sys, os
          try:
              from process_anubis_zip import process_zip
              token = os.environ.get('CUSTOM_TOKEN') or None
              date_dir, url_file, count, analysis_md = process_zip('anubis_upload.zip', token=token)
              if count == 0:
                  print('::error::处理完成但未生成任何有效记录')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('success=false\n')
                      f.write('error=文件内容无法解析为有效的 anubis 数据，请检查数据格式是否正确\n')
                  sys.exit(0)
              with open('analysis_result.md', 'w', encoding='utf-8') as af:
                  af.write(analysis_md)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'date_dir={date_dir}\n')
                  f.write(f'url_file={url_file}\n')
                  f.write(f'count={count}\n')
                  f.write('success=true\n')
          except Exception as e:
              print(f'::error::处理失败: {e}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('success=false\n')
                  f.write(f'error=处理出错: {e}\n')
          "

      - name: Post error comment with format guide
        if: steps.extract.outputs.found == 'true' && steps.process.outputs.success == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "❌ **数据处理失败**

          **错误信息:** ${{ steps.process.outputs.error }}

          ---

          ### 📄 Anubis 标准数据格式说明

          **ZIP 压缩包（内含多个 .txt 文件）**

          每个 txt 文件每行一个 JSON 对象：
          \`\`\`
          {\"dt\":{\"si\":{\"rl\":[...],\"sid\":\"...\",\"ml\":1,\"cs\":2.0,\"tbb\":20.0,\"blb\":4329.0,\"blab\":4309.0,\"bl\":4327.0,\"aw\":18.0,\"wp\":{...}}},\"err\":null}
          \`\`\`

          ### ⚠️ 常见问题
          - Anubis 仅支持 \`.zip\` 格式（不支持单独 .txt）
          - JSON 必须包含 \`dt.si\` 外层包装
          - 必需字段: \`rl\`, \`sid\`, \`ml\`, \`cs\`, \`tbb\`, \`blb\`, \`blab\`, \`bl\`, \`aw\`, \`wp\`"

      - name: Update README navigation
        if: steps.extract.outputs.found == 'true' && steps.process.outputs.success == 'true'
        run: python generate_nav.py

      - name: Commit and push
        if: steps.extract.outputs.found == 'true' && steps.process.outputs.success == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add anubisdate/ README.md
          git commit -m "Add anubis data ${{ steps.process.outputs.date_dir }}"
          git push

      - name: Add label and comment with workflow guide
        if: steps.extract.outputs.found == 'true' && steps.process.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 添加待修复标签（不存在则自动创建）
          gh label create "待修复" --color "d73a4a" --description "等待开发修复" --repo ${{ github.repository }} 2>/dev/null || true
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "待修复" || true

          URL_CONTENT=$(cat "${{ steps.process.outputs.url_file }}")
          ANALYSIS_CONTENT=$(cat analysis_result.md 2>/dev/null || echo "_无分析数据_")

          # 确定当前使用的 token
          USED_TOKEN="${{ steps.extract.outputs.token }}"
          if [ -z "$USED_TOKEN" ]; then
            USED_TOKEN="b3bb96ff1faef019504b83495ec3e45a"
            TOKEN_SOURCE="默认"
          else
            TOKEN_SOURCE="自定义"
          fi

          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "✅ **数据处理完成！** 共 ${{ steps.process.outputs.count }} 个文件。

          \`\`\`
          ${URL_CONTENT}
          \`\`\`

          ---

          ## 📊 数据分析摘要

          ${ANALYSIS_CONTENT}

          ---

          ### 🔑 Token 信息

          当前使用的 token（${TOKEN_SOURCE}）: \`${USED_TOKEN}\`

          如需更换 token，可以：
          - **方式一**：将链接中的 \`token=${USED_TOKEN}\` 替换为你的 token
          - **方式二**：新建 Issue，在正文中添加 \`token: 你的新token\` 重新生成

          ---

          ### 📌 后续流程

          | 步骤 | 操作人 | 回复内容 | 说明 |
          |------|--------|----------|------|
          | 1️⃣ | 开发 | \`程序已修复\` | 程序修复后回复，状态变为【待验证】 |
          | 2️⃣ | 测试 | \`测试已经验证\` | 验证通过后回复，Issue 自动关闭 |

          > 💡 请直接在本 Issue 下方回复对应关键词即可触发状态流转。"
