name: Process Ox Data

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: contains(github.event.issue.title, 'ox')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract attachment URL from issue body
        id: extract
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Match GitHub attachment URLs ending in .txt or .zip
          FILE_URL=$(echo "$ISSUE_BODY" | grep -oP 'https://github\.com/[^\s\)\]]+\.(txt|zip)' | head -1)
          if [ -z "$FILE_URL" ]; then
            echo "No .txt/.zip attachment URL found in issue body"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "url=$FILE_URL" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          # 获取文件扩展名
          EXT="${FILE_URL##*.}"
          echo "ext=$EXT" >> "$GITHUB_OUTPUT"
          echo "Found file URL: $FILE_URL (type: $EXT)"

      - name: Post skip comment with format guide
        if: steps.extract.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "⚠️ **未在 Issue 正文中找到 .txt 或 .zip 附件链接，跳过处理。**

          ### 📋 提交说明

          请在 Issue 正文中直接拖拽上传 \`.txt\` 或 \`.zip\` 文件（GitHub 会自动生成附件链接）。

          ### 📄 支持的数据格式

          **格式一：单行 JSONL（每行一个 JSON 对象）**
          \`\`\`
          {\"code\":200,\"data\":{\"rl\":[7,7,7,99,7,7,7,6,0,6,3,99],\"sid\":\"315361\",\"ml\":1,\"cs\":2.0,...}}
          {\"code\":200,\"data\":{\"rl\":[3,5,7,6,7,5,6,3,5],\"sid\":\"315362\",\"ml\":1,\"cs\":2.0,...}}
          \`\`\`

          **格式二：多行格式化 JSON（会自动转换为单行再处理）**
          \`\`\`json
          {
              \"code\": 200,
              \"data\": {
                  \"rl\": [7, 7, 7, 99, 7, 7, 7, 6, 0, 6, 3, 99],
                  \"sid\": \"315361\",
                  \"ml\": 1,
                  \"cs\": 2.0,
                  ...
              }
          }
          \`\`\`

          **格式三：ZIP 压缩包（内含多个 .txt 文件，每个 txt 为上述格式之一）**

          ### ⚠️ 注意事项
          - 文件必须是 \`.txt\` 或 \`.zip\` 格式
          - JSON 必须包含 \`data\` 或 \`dt.si\` 字段
          - 必需字段: \`rl\`, \`sid\`, \`ml\`, \`cs\`, \`tbb\`, \`blb\`, \`blab\`, \`bl\`, \`aw\`, \`wp\`
          - 请勿上传其他格式（如 .json, .csv 等），系统无法处理"

      - name: Download file
        if: steps.extract.outputs.found == 'true'
        run: |
          curl -L -o "ox_upload.${{ steps.extract.outputs.ext }}" "${{ steps.extract.outputs.url }}"
          ls -la ox_upload.*

      - name: Process file
        if: steps.extract.outputs.found == 'true'
        id: process
        run: |
          python -c "
          import sys, os
          try:
              from process_ox_txt import process_file
              date_dir, url_file, count, analysis_md = process_file('ox_upload.${{ steps.extract.outputs.ext }}')
              if count == 0:
                  print('::error::处理完成但未生成任何有效记录')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('success=false\n')
                      f.write('error=文件内容无法解析为有效的 ox 数据，请检查数据格式是否正确\n')
                  sys.exit(0)
              with open('analysis_result.md', 'w', encoding='utf-8') as af:
                  af.write(analysis_md)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'date_dir={date_dir}\n')
                  f.write(f'url_file={url_file}\n')
                  f.write(f'count={count}\n')
                  f.write('success=true\n')
          except Exception as e:
              print(f'::error::处理失败: {e}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('success=false\n')
                  f.write(f'error=处理出错: {e}\n')
          "

      - name: Post error comment with format guide
        if: steps.extract.outputs.found == 'true' && steps.process.outputs.success == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "❌ **数据处理失败**

          **错误信息:** ${{ steps.process.outputs.error }}

          ---

          ### 📄 Ox 标准数据格式说明

          **格式一：单行 JSONL（推荐，每行一个 JSON 对象）**
          \`\`\`
          {\"code\":200,\"data\":{\"rl\":[7,7,7,99,7,7,7,6,0,6,3,99],\"sid\":\"315361\",\"ml\":1,\"cs\":2.0,\"tbb\":20.0,\"blb\":4329.0,\"blab\":4309.0,\"bl\":4327.0,\"aw\":18.0,\"wp\":{\"1\":[0,4,8]},\"tb\":20.0,\"tw\":18.0,\"np\":-2.0,...}}
          \`\`\`

          **格式二：多行格式化 JSON（自动转换为单行处理）**
          \`\`\`json
          {
              \"code\": 200,
              \"data\": {
                  \"rl\": [7, 7, 7, 99, 7, 7, 7, 6, 0, 6, 3, 99],
                  \"sid\": \"315361\",
                  \"ml\": 1,
                  \"cs\": 2.0,
                  \"tbb\": 20.0,
                  \"blb\": 4329.0,
                  \"blab\": 4309.0,
                  \"bl\": 4327.0,
                  \"aw\": 18.0,
                  \"wp\": {\"1\": [0, 4, 8]}
              }
          }
          \`\`\`

          **格式三：ZIP 压缩包（内含多个 .txt 文件）**

          ### ⚠️ 常见问题
          - JSON 必须包含 \`data\` 或 \`dt.si\` 外层包装
          - 必需字段: \`rl\`, \`sid\`, \`ml\`, \`cs\`, \`tbb\`, \`blb\`, \`blab\`, \`bl\`, \`aw\`, \`wp\`
          - 仅支持 \`.txt\` 和 \`.zip\` 格式（\`.json\`, \`.csv\` 等无法处理）
          - 请确保 JSON 格式正确，无多余逗号或缺失括号"

      - name: Update README navigation
        if: steps.extract.outputs.found == 'true' && steps.process.outputs.success == 'true'
        run: python generate_nav.py

      - name: Commit and push
        if: steps.extract.outputs.found == 'true' && steps.process.outputs.success == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oxdate/ README.md
          git commit -m "Add ox data ${{ steps.process.outputs.date_dir }}"
          git push

      - name: Add label and comment with workflow guide
        if: steps.extract.outputs.found == 'true' && steps.process.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 添加待修复标签（不存在则自动创建）
          gh label create "待修复" --color "d73a4a" --description "等待开发修复" --repo ${{ github.repository }} 2>/dev/null || true
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "待修复" || true

          URL_CONTENT=$(cat "${{ steps.process.outputs.url_file }}")
          ANALYSIS_CONTENT=$(cat analysis_result.md 2>/dev/null || echo "_无分析数据_")
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "✅ **数据处理完成！** 共 ${{ steps.process.outputs.count }} 个文件。

          \`\`\`
          ${URL_CONTENT}
          \`\`\`

          ---

          ## 📊 数据分析摘要

          ${ANALYSIS_CONTENT}

          ---

          ### 📌 后续流程

          | 步骤 | 操作人 | 回复内容 | 说明 |
          |------|--------|----------|------|
          | 1️⃣ | 开发 | \`程序已修复\` | 程序修复后回复，状态变为【待验证】 |
          | 2️⃣ | 测试 | \`测试已经验证\` | 验证通过后回复，Issue 自动关闭 |

          > 💡 请直接在本 Issue 下方回复对应关键词即可触发状态流转。"
